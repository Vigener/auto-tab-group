<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auto Tab Group</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #1a1a1a;
      --text-sub: #666666;
      --border: #e0e0e0;
      --accent: #2563eb;
      --toggle-off: #cbd5e1;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1e1e1e;
        --text: #f3f4f6;
        --text-sub: #9ca3af;
        --border: #374151;
        --accent: #3b82f6;
        --toggle-off: #4b5563;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 280px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 15px;
      font-weight: 600;
    }

    .badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: var(--border);
      color: var(--text-sub);
    }

    .setting-item {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .setting-info {
      flex: 1;
    }

    .setting-title {
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 4px;
    }

    .setting-desc {
      font-size: 11px;
      color: var(--text-sub);
      line-height: 1.4;
    }

    /* Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 22px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--toggle-off);
      transition: .2s;
      border-radius: 22px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent);
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    footer {
      margin-top: 16px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Auto Tab Group</h1>
    <span class="badge">v1.0.0</span>
  </header>

  <div class="setting-item">
    <div class="setting-info">
      <div class="setting-title">親タイトルを名前に適用</div>
      <div class="setting-desc">
        新規グループ作成時、親ページのタイトルを自動設定します（オフの場合は無名でシンプルに作成）。
      </div>
    </div>
    <label class="switch">
      <input type="checkbox" id="autoNameGroup">
      <span class="slider"></span>
    </label>
  </div>

  <footer>
    Cmd+クリックで自動グループ化
  </footer>

  <script src="popup.js"></script>
</body>
</html>
